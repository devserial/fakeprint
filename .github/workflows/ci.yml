name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fetch WSD specs (licence accepted, test inputs only)
        shell: pwsh
        run: ./scripts/Get-WsdSpecs.ps1 -AcceptLicense

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy -p fakeprint --all-targets -- -D warnings

      - name: test
        run: cargo test -p fakeprint

  python-lab:
    name: python lab
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: fetch WSD specs (licence accepted, test inputs only)
        shell: pwsh
        run: ./scripts/Get-WsdSpecs.ps1 -AcceptLicense

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e "./python[dev]"

      - name: Offline unit tests
        working-directory: python
        run: pytest -m "not live" -q
